<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">TrailRAG — Principle: usable under low-quality data / 低质量数据可用性原理</text>
  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#64748b">messy chats · conflicting statements · noisy fund/call logs · uncertainty</text>

  <!-- input -->
  <rect x="300" y="64" width="360" height="44" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Low-quality / contradictory evidence</text>

  <!-- left: traditional -->
  <text x="250" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Traditional RAG — breaks</text>
  <g>
    <rect x="40" y="146" width="420" height="56" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="58" y="170" font-size="12" font-weight="700" fill="#b91c1c">✗</text>
    <text x="80" y="170" font-size="11.5" fill="#7f1d1d">Deterministic clues diluted by semantic noise</text>
    <text x="80" y="190" font-size="10.5" fill="#991b1b">phone / ID lost inside fuzzy vectors</text>

    <rect x="40" y="212" width="420" height="56" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="58" y="236" font-size="12" font-weight="700" fill="#b91c1c">✗</text>
    <text x="80" y="236" font-size="11.5" fill="#7f1d1d">Field semantics dropped</text>
    <text x="80" y="256" font-size="10.5" fill="#991b1b">CSV rows flattened to plain text</text>

    <rect x="40" y="278" width="420" height="56" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="58" y="302" font-size="12" font-weight="700" fill="#b91c1c">✗</text>
    <text x="80" y="302" font-size="11.5" fill="#7f1d1d">No event nodes → no multi-hop</text>
    <text x="80" y="322" font-size="10.5" fill="#991b1b">cannot link chat → statement → fund</text>

    <rect x="40" y="344" width="420" height="56" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="58" y="368" font-size="12" font-weight="700" fill="#b91c1c">✗</text>
    <text x="80" y="368" font-size="11.5" fill="#7f1d1d">No time model</text>
    <text x="80" y="388" font-size="10.5" fill="#991b1b">cannot rebuild "who did what, when"</text>

    <rect x="40" y="410" width="420" height="56" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="58" y="434" font-size="12" font-weight="700" fill="#b91c1c">✗</text>
    <text x="80" y="434" font-size="11.5" fill="#7f1d1d">Contradictions silently merged</text>
    <text x="80" y="454" font-size="10.5" fill="#991b1b">no provenance, no conflict signal</text>
  </g>

  <!-- right: trailrag -->
  <text x="710" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">TrailRAG — traces through</text>
  <g>
    <rect x="500" y="146" width="420" height="56" rx="9" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="518" y="170" font-size="12" font-weight="700" fill="#0369a1">✓</text>
    <text x="540" y="170" font-size="11.5" fill="#0c4a6e">Event-node anchoring for cross-source hops</text>
    <text x="540" y="190" font-size="10.5" fill="#075985">chat → statement → fund connected</text>

    <rect x="500" y="212" width="420" height="56" rx="9" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="518" y="236" font-size="12" font-weight="700" fill="#0369a1">✓</text>
    <text x="540" y="236" font-size="11.5" fill="#0c4a6e">Lexical deterministic floor = 0.85</text>
    <text x="540" y="256" font-size="10.5" fill="#075985">phone / ID matched exactly, not fuzzily</text>

    <rect x="500" y="278" width="420" height="56" rx="9" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="518" y="302" font-size="12" font-weight="700" fill="#0369a1">✓</text>
    <text x="540" y="302" font-size="11.5" fill="#0c4a6e">CSV field semantics preserved</text>
    <text x="540" y="322" font-size="10.5" fill="#075985">rows/columns stay structured</text>

    <rect x="500" y="344" width="420" height="56" rx="9" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="518" y="368" font-size="12" font-weight="700" fill="#0369a1">✓</text>
    <text x="540" y="368" font-size="11.5" fill="#0c4a6e">Closed multi-hop evidence chain</text>
    <text x="540" y="388" font-size="10.5" fill="#075985">PPR (1–5) + relation chains</text>

    <rect x="500" y="410" width="420" height="56" rx="9" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="518" y="434" font-size="12" font-weight="700" fill="#0369a1">✓</text>
    <text x="540" y="434" font-size="11.5" fill="#0c4a6e">Conflicts surfaced · timeline rebuilt</text>
    <text x="540" y="454" font-size="10.5" fill="#075985">"who did what, when" recoverable</text>
  </g>

  <line x1="480" y1="108" x2="250" y2="134" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="480" y1="108" x2="710" y2="134" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="200" y="486" width="560" height="44" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="480" y="514" text-anchor="middle" font-size="12.5" font-weight="700" fill="#854d0e">Even noisy, contradictory data stays traceable → evidentiary, not hallucinated</text>
</svg>
