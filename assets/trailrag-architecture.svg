<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <rect width="960" height="580" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">TrailRAG — System Architecture / 系统架构</text>
  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#64748b">Trace every clue · evidentiary · multi-hop · time-aware retrieval</text>

  <!-- Input layer -->
  <rect x="36" y="64" width="888" height="62" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="86" font-size="13" font-weight="700" fill="#0ea5e9">Mixed Evidentiary Data / 混合证据数据</text>
  <text x="52" y="106" font-size="11.5" fill="#334155">Chat logs · Police statements · Fund-flow CSV · Call logs · ANPR/Kakou · Forensic JSON · Office(xlsx/docx)</text>

  <!-- Two engines -->
  <rect x="36" y="142" width="430" height="118" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="52" y="164" font-size="13.5" font-weight="700" fill="#0369a1">① Traditional RAG Channel (vector-direct)</text>
  <text x="52" y="186" font-size="11.5" fill="#0c4a6e">Chunk → Embed → Vector store</text>
  <text x="52" y="208" font-size="11.5" fill="#0c4a6e">Searchable immediately (low time-to-first-search)</text>
  <text x="52" y="230" font-size="11.5" fill="#0c4a6e">Orthogonal toggle: search_mode ∈ {vector,keyword,hybrid}</text>
  <text x="52" y="252" font-size="11" fill="#075985">No graph needed to answer → fast first response</text>

  <rect x="494" y="142" width="430" height="118" rx="10" fill="#ede9fe" stroke="#6366f1" stroke-width="1.5"/>
  <text x="510" y="164" font-size="13.5" font-weight="700" fill="#4338ca">② Graph-Augmented Channel</text>
  <text x="510" y="186" font-size="11.5" fill="#312e81">Event-node extraction (not keyword/entity-only)</text>
  <text x="510" y="208" font-size="11.5" fill="#312e81">PPR multi-hop (1–5 hops, default 3)</text>
  <text x="510" y="230" font-size="11.5" fill="#312e81">Lexical deterministic channel (floor 0.85 on IDs)</text>
  <text x="510" y="252" font-size="11" fill="#3730a3">Relation-chain enumeration for closed evidence</text>

  <!-- Storage layer -->
  <rect x="36" y="280" width="276" height="60" rx="10" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="174" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">Vector DB</text>
  <text x="174" y="324" text-anchor="middle" font-size="11" fill="#115e59">chunks / entities / relations</text>

  <rect x="342" y="280" width="276" height="60" rx="10" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="480" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">Graph DB</text>
  <text x="480" y="324" text-anchor="middle" font-size="11" fill="#115e59">event nodes + weighted edges</text>

  <rect x="648" y="280" width="276" height="60" rx="10" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="786" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">KV Store</text>
  <text x="786" y="324" text-anchor="middle" font-size="11" fill="#115e59">LLM cache · doc status</text>

  <!-- Retrieval layer -->
  <rect x="36" y="360" width="888" height="78" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="52" y="382" font-size="13" font-weight="700" fill="#4338ca">Retrieval Layer / 检索层</text>
  <text x="52" y="404" font-size="11.5" fill="#312e81">vector · keyword · hybrid  +  graph PPR · RRF fusion (K=60) · lexical match</text>
  <text x="52" y="426" font-size="11.5" fill="#312e81">rerank  →  controlled token budget (MAX_ENTITY/RELATION/TOTAL_TOKENS)</text>

  <!-- Output layer -->
  <rect x="36" y="456" width="888" height="64" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="52" y="480" font-size="13" font-weight="700" fill="#854d0e">Explainable Output / 可解释输出</text>
  <text x="52" y="502" font-size="11.5" fill="#713f12">Answer + source citations · closed evidence chain · contradiction surfaced · timeline reconstruction</text>
  <text x="52" y="522" font-size="11" fill="#713f12">"who did what, when" across the whole case</text>

  <!-- connectors -->
  <line x1="480" y1="126" x2="480" y2="142" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="251" y1="260" x2="174" y2="280" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="709" y1="260" x2="480" y2="280" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="786" y1="260" x2="786" y2="280" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="340" x2="480" y2="360" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="438" x2="480" y2="456" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
